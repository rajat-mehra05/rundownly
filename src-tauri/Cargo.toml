[package]
name = "rundownly"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[lib]
name = "rundownly_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "cookies"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
regex = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
